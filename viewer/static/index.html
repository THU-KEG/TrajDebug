<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trajectory Diagnosis Viewer</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-title">轨迹诊断 Viewer</div>
    <div class="toolbar-controls">
      <label>数据集
        <select id="dataset-select"></select>
      </label>
      <label>轨迹
        <select id="trajectory-select"></select>
      </label>
      <label class="grow">output
        <input id="output-input" type="text" spellcheck="false" />
      </label>
      <button id="reload-btn" title="重新扫描 output 目录">刷新</button>
    </div>
    <div id="status" class="status"></div>
  </header>

  <section id="timeline-section" class="timeline-section">
    <div class="timeline-head">
      <span class="timeline-label">错误生命周期时间线</span>
      <div id="legend" class="legend"></div>
    </div>
    <div id="timeline" class="timeline"></div>
  </section>

  <main class="main">
    <section id="trajectory-pane" class="trajectory-pane">
      <div class="pane-head">
        <span class="pane-title">轨迹</span>
        <span id="current-task" class="current-task"></span>
        <label class="toggle"><input type="checkbox" id="expand-obs" /> 展开所有观察</label>
      </div>
      <div id="trajectory" class="trajectory"></div>
    </section>

    <aside id="report-pane" class="report-pane">
      <div class="pane-head"><span>诊断报告</span></div>
      <div id="report" class="report"></div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
