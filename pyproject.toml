[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajdebug"
version = "0.1.0"
description = "Error-lifecycle tracing for critical failures in long-horizon agent trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "filelock",
  "httpx",
  "openai",
]

[project.optional-dependencies]
viewer = [
  "fastapi",
  "uvicorn",
]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
include = ["detector*", "data_processing*", "viewer*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
